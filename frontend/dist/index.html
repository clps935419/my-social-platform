<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Platform - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 700;
        }
        p {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .status {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 30px 0;
            border-radius: 8px;
            text-align: left;
        }
        .status h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        .status ul {
            list-style: none;
            padding-left: 0;
        }
        .status li {
            padding: 8px 0;
            color: #555;
        }
        .status li::before {
            content: "✓ ";
            color: #4CAF50;
            font-weight: bold;
            margin-right: 8px;
        }
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .btn-secondary {
            background: #764ba2;
        }
        .btn-secondary:hover {
            background: #643a8d;
        }
        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 社群平台</h1>
        <p>我們正在建立一個全新的社群媒體平台。Phase 1 & 2 基礎架構已完成！</p>
        
        <div class="status">
            <h2>📊 目前狀態</h2>
            <ul>
                <li>資料庫層 (PostgreSQL 16)</li>
                <li>後端 API (Spring Boot 3)</li>
                <li>前端框架 (Vue 3 + Vite)</li>
                <li>反向代理 (Nginx)</li>
                <li>Docker 容器化部署</li>
            </ul>
        </div>

        <div class="links">
            <a href="/api/swagger-ui/index.html" class="btn">
                📚 API 文件 (Swagger)
            </a>
            <a href="/api/health" class="btn btn-secondary">
                ❤️ 健康檢查
            </a>
        </div>

        <div class="footer">
            <p>Phase 1 & Phase 2 已完成 | 前端 UI 開發中...</p>
        </div>
    </div>
</body>
</html>
